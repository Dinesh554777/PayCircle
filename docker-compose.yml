services:
  db:
    image: postgres:16-alpine
    container_name: paycircle_db
    environment:
      POSTGRES_USER: paycircle
      POSTGRES_PASSWORD: paycircle
      POSTGRES_DB: paycircle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycircle"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: paycircle_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://paycircle:paycircle@db:5432/paycircle
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
